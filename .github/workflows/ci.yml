name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # bwrap exige user namespaces não restritos; em runners recentes do Ubuntu liberar:
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: pip install -e '.[dev]'
      - run: python -m extrator_enem.cli sonda   # isolamento real ou CI vermelho (falha fechada)
      - run: pytest -q   # testes com PDFs reais se pulam sem dados/provas (não versionados)
