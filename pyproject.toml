[project]
name = "extrator-enem"
version = "0.0.1"
description = "Extrator de provas do ENEM (prova + gabarito PDF -> questões estruturadas em JSON)"
requires-python = ">=3.11"
dependencies = ["pymupdf>=1.24"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
extrator-enem = "extrator_enem.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
